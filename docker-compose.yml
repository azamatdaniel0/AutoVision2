services:
  plate_rec:
    restart: unless-stopped
    build: .
    container_name: plate_rec
    ports:
      - "8988:8988"
    volumes:
      - .:/project
    environment:
      - TZ=Asia/Bishkek
    deploy:  
      resources:
        reservations:      
          devices:
            - driver: nvidia          
              count: all
              capabilities: [ gpu ]


